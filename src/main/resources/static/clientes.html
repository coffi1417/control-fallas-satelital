<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <h2>Control de Fallas</h2>

        <nav>
            <a href="dashboard.html">Inicio</a>
            <a href="clientes.html">Clientes</a>
            <a href="instalaciones.html">Instalaciones</a>
            <a href="equipos.html">Equipos</a>
            <a href="ordenes.html">Órdenes de servicio</a>
            <a href="asistencias.html">Asistencias técnicas</a>
            <a href="fallas.html">Fallas</a>
            <a href="soluciones.html">Soluciones</a>
            <a href="materiales.html">Materiales</a>
            <a href="tecnicos.html">Técnicos</a>
            <a href="usuarios.html">Usuarios</a>
        </nav>

        <button onclick="cerrarSesion()">
            Cerrar sesión
        </button>

    </aside>

    <main class="contenido">

        <header class="encabezado-pagina">

            <div>
                <h1>Clientes</h1>
                <p id="usuarioActual"></p>
            </div>

            <div style="display:flex; gap:10px;">

                <button
                    class="boton-actualizar"
                    onclick="abrirFormularioNuevo()"
                >
                    Nuevo cliente
                </button>

                <button
                    onclick="cargarClientes()"
                >
                    Actualizar
                </button>

            </div>

        </header>


        <section
            style="
                background:white;
                padding:16px;
                margin-bottom:20px;
                border-radius:8px;
            "
        >

            <label
                for="buscarCliente"
                style="font-weight:bold;"
            >
                Buscar cliente
            </label>

            <input
                id="buscarCliente"
                type="text"
                placeholder="Identificación o nombre"
                oninput="filtrarClientes()"
                style="
                    width:100%;
                    max-width:420px;
                    padding:10px;
                    margin-top:8px;
                    box-sizing:border-box;
                "
            >

        </section>


        <section
            id="tablaClientes"
            class="seccion-datos"
        >
            <p>Cargando clientes...</p>
        </section>

    </main>

</div>


<div
    id="modalCliente"
    style="
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.65);
        align-items:center;
        justify-content:center;
        z-index:9999;
    "
>

    <div
        style="
            background:white;
            width:90%;
            max-width:700px;
            max-height:90vh;
            overflow-y:auto;
            padding:25px;
            border-radius:10px;
        "
    >

        <h2 id="tituloFormulario">
            Nuevo cliente
        </h2>


        <input
            type="hidden"
            id="idCliente"
        >


        <div
            style="
                display:grid;
                grid-template-columns:repeat(
                    auto-fit,
                    minmax(220px,1fr)
                );
                gap:15px;
            "
        >

            <div>
                <label>Nombres *</label>

                <input
                    id="nombres"
                    type="text"
                    style="width:100%; padding:9px; box-sizing:border-box;"
                >
            </div>


            <div>
                <label>Apellidos</label>

                <input
                    id="apellidos"
                    type="text"
                    style="width:100%; padding:9px; box-sizing:border-box;"
                >
            </div>


            <div>
                <label>Tipo de documento</label>

                <select
                    id="tipoDocumento"
                    style="width:100%; padding:9px;"
                >
                    <option value="">Seleccione</option>
                    <option value="CC">CC</option>
                    <option value="CE">CE</option>
                    <option value="NIT">NIT</option>
                    <option value="TI">TI</option>
                    <option value="PASAPORTE">Pasaporte</option>
                </select>
            </div>


            <div>
                <label>Número de documento</label>

                <input
                    id="numeroDocumento"
                    type="text"
                    style="width:100%; padding:9px; box-sizing:border-box;"
                >
            </div>


            <div>
                <label>Teléfono</label>

                <input
                    id="telefono"
                    type="text"
                    style="width:100%; padding:9px; box-sizing:border-box;"
                >
            </div>


            <div>
                <label>Correo</label>

                <input
                    id="correo"
                    type="email"
                    style="width:100%; padding:9px; box-sizing:border-box;"
                >
            </div>


            <div>
                <label>Dirección *</label>

                <input
                    id="direccion"
                    type="text"
                    style="width:100%; padding:9px; box-sizing:border-box;"
                >
            </div>


            <div>
                <label>Barrio</label>

                <input
                    id="barrio"
                    type="text"
                    style="width:100%; padding:9px; box-sizing:border-box;"
                >
            </div>


            <div>
                <label>Ciudad *</label>

                <input
                    id="ciudad"
                    type="text"
                    style="width:100%; padding:9px; box-sizing:border-box;"
                >
            </div>


            <div>
                <label>Departamento</label>

                <input
                    id="departamento"
                    type="text"
                    style="width:100%; padding:9px; box-sizing:border-box;"
                >
            </div>


            <div>
                <label>Estado</label>

                <select
                    id="estado"
                    style="width:100%; padding:9px;"
                >
                    <option value="true">
                        Activo
                    </option>

                    <option value="false">
                        Inactivo
                    </option>
                </select>
            </div>

        </div>


        <p
            id="mensajeFormulario"
            style="margin-top:15px;"
        ></p>


        <div
            style="
                display:flex;
                justify-content:flex-end;
                gap:10px;
                margin-top:20px;
            "
        >

            <button
                onclick="cerrarFormularioCliente()"
            >
                Cancelar
            </button>

            <button
                class="boton-actualizar"
                onclick="guardarCliente()"
            >
                Guardar
            </button>

        </div>

    </div>

</div>


<script src="clientes.js"></script>

</body>
</html>
