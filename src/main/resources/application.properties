spring.application.name=control-fallas-satelital

# ==========================
# CONEXION A MYSQL
# Local por defecto / Aiven mediante variables de entorno
# ==========================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_control_fallas_satelital}?useSSL=${DB_USE_SSL:false}&requireSSL=${DB_REQUIRE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ==========================
# JPA / HIBERNATE
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================
# SERVIDOR
# Local 8080 / Render usa PORT
# ==========================
server.port=${PORT:8080}

# ==========================
# MANEJO DE ERRORES
# ==========================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never