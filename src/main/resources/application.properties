spring.application.name=control-fallas-satelital

# ==========================
# CONEXION A MYSQL
# Local: usa los valores predeterminados actuales.
# Produccion: Render define DB_HOST, DB_PORT, DB_NAME, DB_USER y DB_PASSWORD.
# ==========================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_control_fallas_satelital}?useSSL=${DB_USE_SSL:false}&requireSSL=${DB_REQUIRE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# ==========================
# JPA / HIBERNATE
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================
# SERVIDOR
# Render proporciona PORT. Localmente conserva 8080.
# ==========================
server.port=${PORT:8080}

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
